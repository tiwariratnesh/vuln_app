apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-app-sca-test
  namespace: raksha
  labels:
    app: vuln-app-sca-test
    test: sca-reachability
  annotations:
    ai-spm.io/code-repo: "https://github.com/tiwariratnesh/vuln_app"
    ai-spm.io/code-branch: "main"
    ai-spm.io/code-path: "/"
    ai-spm.io/commit-sha: "sca-reachability-test"
    description: "Test app with reachable/unreachable CVEs in direct and transitive dependencies"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-app-sca-test
  template:
    metadata:
      labels:
        app: vuln-app-sca-test
      annotations:
        ai-spm.io/code-repo: "https://github.com/tiwariratnesh/vuln_app"
        ai-spm.io/code-branch: "main"
        ai-spm.io/code-path: "/"
        ai-spm.io/commit-sha: "sca-reachability-test"
    spec:
      containers:
      - name: app
        image: vuln-app-sca-test:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "400m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-app-sca-test
  namespace: raksha
spec:
  selector:
    app: vuln-app-sca-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
